        C30.8 46.2 31 46.8 30.4 47.6
        C29.7 48.6 29.9 49.8 31.1 50.6
        C32.3 51.3 33.3 52.2 33.5 54.2
        L33.5 64 L64 64 Z"/>
    </mask>
  </defs>
